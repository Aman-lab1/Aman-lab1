" style="animation-delay:1.33s">@@@@@@@@@@%*+****+#@@@@@@%+****+*%@@@@@@@@@@</text><text x="34" y="300.4" class="ascii-row" style="animation-delay:1.385s">@@@%%%%%%%%*+****+#%%%%%%#+****+*%%%%%%%%@@@</text><text x="34" y="313.6" class="ascii-row" style="animation-delay:1.44s">@@@%************************************#@@@</text><text x="34" y="326.8" class="ascii-row" style="animation-delay:1.495s">@@@#+++++++*******++++++++*******+++++++#@@@</text><text x="34" y="340.0" class="ascii-row" style="animation-delay:1.55s">@@@#++++++++++++++++++++++++++++++++++++#@@@</text><text x="34" y="353.2" class="ascii-row" style="animation-delay:1.605s">@@@%************************************#@@@</text><text x="34" y="366.4" class="ascii-row" style="animation-delay:1.66s">@@@%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%@@@</text><text x="34" y="379.6" class="ascii-row" style="animation-delay:1.715s">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</text>
